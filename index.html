<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; }

:root {
    --bg: #f5f4f3;
    --fg: #000000;
    --btn-bg: rgba(0, 0, 0, 0.06);
    --btn-bg-hover: rgba(0, 0, 0, 0.14);
}
body.alt {
    --bg: #121212;
    --fg: #f5f4f3;
    --btn-bg: rgba(255, 255, 255, 0.10);
    --btn-bg-hover: rgba(255, 255, 255, 0.20);
}

html, body { margin: 0; padding: 0; width: 100%; }

/* ==== OCULTAR BARRA DE SCROLL ==== */
html {
    scrollbar-width: none;
    -ms-overflow-style: none;
}
html::-webkit-scrollbar,
body::-webkit-scrollbar {
    width: 0;
    height: 0;
    display: none;
}

body {
    background-color: var(--bg);
    color: var(--fg);
    transition: background-color .5s ease, color .5s ease;
    position: relative;
    overflow-x: hidden;
    font-family: system-ui, -apple-system, sans-serif;
}

/* ==== ORBE (JS, 30fps, baix consum) ==== */
.floating-orb {
    position: fixed;
    top: 0;
    left: 0;
    width: 320px;
    height: 320px;
    border-radius: 50%;
    background: radial-gradient(circle,
                rgba(255, 20, 147, 0.55) 0%,
                rgba(255, 80, 0, 0.35) 45%,
                rgba(255, 180, 0, 0.12) 72%,
                transparent 90%);
    filter: blur(30px);
    pointer-events: none;
    z-index: 0;
    transform: translate3d(0, 0, 0);
    will-change: transform;
    contain: strict;
}

/* ==== THEME BUTTON ==== */
#theme-icon {
    position: fixed;
    top: 1.25rem;
    right: 1.25rem;
    z-index: 50;
    padding: 0.5rem;
    border-radius: 9999px;
    border: none;
    background-color: var(--btn-bg);
    color: var(--fg);
    cursor: pointer;
    transition: opacity .5s ease, background-color .2s ease;
    opacity: 0;
    pointer-events: none;
}
#theme-icon:hover { background-color: var(--btn-bg-hover); }
#theme-icon.visible { opacity: 1; pointer-events: auto; }
#theme-icon svg { display: block; }

/* ==== MAIN ==== */
.main-wrap {
    position: relative;
    z-index: 10;
    width: 100%;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    padding: 4rem 0;
}

.main-container {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', 'Arial Narrow', sans-serif;
    font-size: 20vw;
    letter-spacing: -0.05em;
    line-height: 1;
    padding: 0 1rem;
    flex-shrink: 0;
}
@media (min-width: 768px) {
    .main-container { font-size: 16vw; }
}

.group {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex-shrink: 0;
}

/* ==== WHEELS ==== */
.wheel-mask {
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 12%, #000 88%, transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0%, #000 12%, #000 88%, transparent 100%);
    flex-shrink: 0;
}

.number-wheel {
    display: inline-flex;
    justify-content: center;
    align-items: flex-start;
    overflow: hidden;
    height: 1em;
    line-height: 1em;
    position: relative;
    flex-shrink: 0;
    contain: strict;
}

.number-track {
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    backface-visibility: hidden;
    will-change: transform;
}

.number-track > span {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 1em;
    line-height: 1em;
    flex: 0 0 1em;
    white-space: nowrap;
}

.colon {
    font-size: 0.22em;
    opacity: 0.5;
    line-height: 1;
    align-self: center;
    user-select: none;
    margin: 0 0.2em;
}

/* ==== SCROLL SECTION ==== */
#scroll-section {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 72rem;
    margin: 0 auto;
    padding: 4rem 1rem 6rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity .8s ease;
}
#scroll-section.visible { opacity: 1; pointer-events: auto; }

#section-title {
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    text-align: center;
    opacity: 0.45;
    margin: 0 0 3.5rem;
}

#small-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 3.5rem 2rem;
}
@media (min-width: 768px) {
    #small-grid { grid-template-columns: repeat(3, 1fr); }
}

.slot {
    display: flex;
    flex-direction: column;
    align-items: center;
    content-visibility: auto;
    contain-intrinsic-size: 0 5rem;
    contain: layout style;
}

.small-title {
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.7;
    margin-bottom: 0.7rem;
    font-family: system-ui, -apple-system, sans-serif;
    font-weight: 700;
    text-align: center;
    min-height: 1.2em;
}

.small-countdown-wrap {
    font-size: clamp(1.5rem, 2.6vw, 2.4rem);
    font-family: 'Bebas Neue', 'Arial Narrow', sans-serif;
    letter-spacing: -0.05em;
    display: flex;
    align-items: center;
    justify-content: center;
}

.small-group {
    display: flex;
    align-items: center;
    flex-shrink: 0;
}

.small-colon {
    font-size: 0.5em;
    opacity: 0.55;
    line-height: 1;
    align-self: center;
    margin: 0 0.2em;
    transform: translateY(-0.05em);
}
</style>

       1. ORBE ANIMADA (30fps — mateix sistema que l'original)
       ========================================================= */
    var orb = document.getElementById('glowing-orb');
    var orbRunning = !reduceMotion;
    var lastOrbFrame = 0;

    function animateOrb(now) {
        if (!orbRunning) return;
        if (now - lastOrbFrame > 33) {
            var t = now * 0.00015;
            var x = window.innerWidth  / 2 + Math.sin(t * 0.8) * window.innerWidth  * 0.38;
            var y = window.innerHeight / 2 + Math.cos(t * 0.5) * window.innerHeight * 0.32;
            orb.style.transform = 'translate3d(' + (x - 160) + 'px,' + (y - 160) + 'px,0)';
            lastOrbFrame = now;
        }
        requestAnimationFrame(animateOrb);
    }
    if (orbRunning) requestAnimationFrame(animateOrb);

    /* =========================================================
       2. ICONA DE TEMA
       ========================================================= */
    var themeIcon = document.getElementById('theme-icon');
    var iconSun   = document.getElementById('icon-sun');
    var iconMoon  = document.getElementById('icon-moon');
    var hideTimer = null;

    function updateThemeIcon() {
        var isDark = document.body.classList.contains('alt');
        iconSun.style.display  = isDark ? 'none'  : 'block';
        iconMoon.style.display = isDark ? 'block' : 'none';
    }
    function revealIcon() {
        themeIcon.classList.add('visible');
        clearTimeout(hideTimer);
        hideTimer = setTimeout(function () {
            themeIcon.classList.remove('visible');
        }, 2200);
    }
    document.addEventListener('mousemove', revealIcon, { passive: true });
    document.addEventListener('touchstart', revealIcon, { passive: true });
    themeIcon.addEventListener('click', function () {
        document.body.classList.toggle('alt');
        updateThemeIcon();
        revealIcon();
    });
    updateThemeIcon();

    /* =========================================================
       3. RODET NUMÈRIC (ASCENDENT)
       ========================================================= */
    var TRANSITION = 'transform .55s cubic-bezier(.22, 1, .36, 1)';
    var digitWidthCache = {};
    var wheelHtmlCache = {};
    var measureCanvas = document.createElement('canvas');
    var measureCtx = measureCanvas.getContext('2d');

    function getWheelHtml(maxDigit, repeats) {
        var key = maxDigit + 'x' + repeats;
        var html = wheelHtmlCache[key];
        if (html !== undefined) return html;
        html = '';
        for (var r = 0; r < repeats; r++) {
            for (var d = 0; d <= maxDigit; d++) {
                html += '<span>' + d + '</span>';
            }
        }
        wheelHtmlCache[key] = html;
        return html;
    }

    function measureDigit(digit, fontSize) {
        var key = digit + '@' + fontSize.toFixed(2);
        var w = digitWidthCache[key];
        if (w !== undefined) return w;
        measureCtx.font = '400 ' + fontSize + 'px "Bebas Neue", "Arial Narrow", sans-serif';
        w = measureCtx.measureText(String(digit)).width;
        digitWidthCache[key] = w;
        return w;
    }

    function Wheel(trackEl, maxDigit, repeats) {
        this.track     = trackEl;
        this.maxDigit  = maxDigit;
        this.L         = maxDigit + 1;
        this.repeats   = repeats || 3;
        this.total     = this.L * this.repeats;
        this.pos       = 0;
        this.digit     = null;
        this.step      = 0;
        this.wheelEl   = trackEl.parentElement;

        trackEl.innerHTML = getWheelHtml(maxDigit, this.repeats);
        allWheels.push(this);
    }

    Wheel.prototype._measure = function () {
        var fs = parseFloat(window.getComputedStyle(this.track).fontSize);
        this.step = (isFinite(fs) && fs > 0) ? fs : 16;
    };

    Wheel.prototype._fitWidth = function () {
        if (this.digit === null) return;
        var w = measureDigit(this.digit, this.step);
        this.wheelEl.style.width = w + 'px';
    };

    Wheel.prototype._render = function (animate) {
        this.track.style.transition = animate ? TRANSITION : 'none';
        if (!this.step) this._measure();
        this.track.style.transform =
            'translate3d(0,' + (-this.pos * this.step) + 'px,0)';
    };

    Wheel.prototype.remeasure = function () {
        this._measure();
        this._render(false);
        this._fitWidth();
    };

    Wheel.prototype.reset = function (digit) {
        if (digit > this.maxDigit) digit = this.maxDigit;
        else if (digit < 0) digit = 0;
        this.digit = digit;
        this.pos = this.L + digit;
        this._render(false);
        this._fitWidth();
        void this.track.offsetHeight;
    };

    Wheel.prototype.set = function (digit, animate) {
        if (digit > this.maxDigit) digit = this.maxDigit;
        else if (digit < 0) digit = 0;
        if (digit === this.digit) return;
        if (!animate || this.digit === null) { this.reset(digit); return; }
        var L = this.L;
        var steps = ((digit - this.digit) % L + L) % L;
        if (steps === 0) return;
        if (steps * 2 > L) { this.reset(digit); return; }
        if (this.pos + steps > this.total - 1) {
            this.pos -= L;
            this._render(false);
            void this.track.offsetHeight;
        }
        this.pos += steps;
        this.digit = digit;
        this._render(true);
        this._fitWidth();
    };

    var resizeTimer = null;
    window.addEventListener('resize', function () {
        if (resizeTimer) clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () {
            digitWidthCache = {};

    /* =========================================================
       5. CACHE D'OFFSETS DE ZONA HORÀRIA
       ========================================================= */
    var tzFmtCache = {};
    var tzOffsetCache = {};
    var TZ_OFFSET_TTL = 30 * 60 * 1000; // 30 min

    function tzFormatter(tz) {
        var f = tzFmtCache[tz];
        if (f === undefined) {
            try {
                f = new Intl.DateTimeFormat('en-GB', {
                    timeZone: tz,
                    hour12: false,
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
            } catch (e) { f = null; }
            tzFmtCache[tz] = f;
        }
        return f;
    }

    function getTzOffsetMs(tz) {
        var cached = tzOffsetCache[tz];
        var now = Date.now();
        if (cached !== undefined && now - cached.at < TZ_OFFSET_TTL) {
            return cached.off;
        }
        var f = tzFormatter(tz);
        var off = 0;
        if (f) {
            var d = new Date(now);
            var parts = f.formatToParts(d);
            var h = 0, m = 0, s = 0;
            for (var i = 0; i < parts.length; i++) {
                var p = parts[i];
                var t = p.type;
                if (t === 'hour') h = parseInt(p.value, 10) % 24;
                else if (t === 'minute') m = parseInt(p.value, 10);
                else if (t === 'second') s = parseInt(p.value, 10);
            }
            var localSec = h * 3600 + m * 60 + s;
            var utcSec = d.getUTCHours() * 3600 + d.getUTCMinutes() * 60 + d.getUTCSeconds();
            var diff = localSec - utcSec;
            if (diff > 43200) diff -= 86400;
            else if (diff < -43200) diff += 86400;
            off = diff * 1000;
        }
        tzOffsetCache[tz] = { off: off, at: now };
        return off;
    }

    function secondsInDay(tz) {
        var ms = Date.now() + getTzOffsetMs(tz);
        var totalSec = Math.floor(ms / 1000);
        var s = totalSec % 86400;
        return s < 0 ? s + 86400 : s;
    }

    /* =========================================================
       6. DETECCIÓ DEL PAÍS VISITANT
       ========================================================= */
    var localTz = '';
    try {
        localTz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
    } catch (e) { localTz = ''; }

    var localCountry = null;
    for (var ci = 0; ci < COUNTRIES.length; ci++) {
        if (COUNTRIES[ci][1] === localTz) { localCountry = COUNTRIES[ci]; break; }
    }

    /* =========================================================
       7. RELLOTGE PRINCIPAL
       ========================================================= */
    var mainHT = new Wheel(document.getElementById('hours-tens-track'),  2, 3);
    var mainHU = new Wheel(document.getElementById('hours-units-track'), 9, 3);
    var mainMT = new Wheel(document.getElementById('mins-tens-track'),   5, 3);
    var mainMU = new Wheel(document.getElementById('mins-units-track'),  9, 3);
    var mainST = new Wheel(document.getElementById('secs-tens-track'),   5, 3);
    var mainSU = new Wheel(document.getElementById('secs-units-track'),  9, 3);

    function updateMain(animate) {
        var d = new Date();
        var h = d.getHours(), m = d.getMinutes(), s = d.getSeconds();
        mainHT.set((h / 10) | 0, animate);
        mainHU.set(h % 10, animate);
        mainMT.set((m / 10) | 0, animate);
        mainMU.set(m % 10, animate);
        mainST.set((s / 10) | 0, animate);
        mainSU.set(s % 10, animate);
    }

    updateMain(false);

    /* =========================================================
       8. GRAELLA DE PAÏSOS
       ========================================================= */
    var grid = document.getElementById('small-grid');
    var slots = [];
    var visibleSlots = new Set();

    var slotObserver = new IntersectionObserver(function (entries) {
        for (var i = 0; i < entries.length; i++) {
            var entry = entries[i];
            var idx = entry.target.__slotIdx;
            if (entry.isIntersecting) {
                visibleSlots.add(idx);
                var s = slots[idx];
                if (s && !s.wheels) s.ensure();
                if (s) s.tick(false);
            } else {
                visibleSlots.delete(idx);
            }
        }
    }, { rootMargin: '400px 0px' });

    function groupHTML(prefix, wheels) {
        var html = '<div class="small-group"><div class="wheel-mask">';
        for (var i = 0; i < wheels.length; i++) {
            html += '<div class="number-wheel"><div class="number-track" id="' +
                    prefix + '-' + wheels[i] + '"></div></div>';
        }
        html += '</div></div>';
        return html;
    }

    function Slot(idx, country) {
        this.idx     = idx;
        this.tz      = country[1];
        this.wheels  = null;

        var wrapper = document.createElement('div');
        wrapper.className = 'slot';
        wrapper.__slotIdx = idx;

        var p = 'slot-' + idx;
        wrapper.innerHTML =
            '<h3 class="small-title">' + country[0] + '</h3>' +
            '<div class="small-countdown-wrap">' +
                groupHTML(p, ['ht', 'hu']) +
                '<span class="small-colon">:</span>' +
                groupHTML(p, ['mt', 'mu']) +
                '<span class="small-colon">:</span>' +
                groupHTML(p, ['st', 'su']) +
            '</div>';

        grid.appendChild(wrapper);
        this.el = wrapper;
        slotObserver.observe(wrapper);
    }

    Slot.prototype.ensure = function () {
        if (this.wheels) return;
        var p = 'slot-' + this.idx;
        this.wheels = {
            ht: new Wheel(document.getElementById(p + '-ht'), 2, 3),
            hu: new Wheel(document.getElementById(p + '-hu'), 9, 3),
            mt: new Wheel(document.getElementById(p + '-mt'), 5, 3),
            mu: new Wheel(document.getElementById(p + '-mu'), 9, 3),
            st: new Wheel(document.getElementById(p + '-st'), 5, 3),
            su: new Wheel(document.getElementById(p + '-su'), 9, 3)
        };
    };

    Slot.prototype._write = function (animate) {
        var sec = secondsInDay(this.tz);
        var h = (sec / 3600) | 0;
        var m = ((sec % 3600) / 60) | 0;
        var s = sec % 60;
        var w = this.wheels;
        w.ht.set((h / 10) | 0, animate);
        w.hu.set(h % 10, animate);
        w.mt.set((m / 10) | 0, animate);
        w.mu.set(m % 10, animate);
        w.st.set((s / 10) | 0, animate);
        w.su.set(s % 10, animate);
    };

    Slot.prototype.tick = function (animate) {
        this.ensure();
        this._write(animate);
    };

    /* ---------- Construcció de la llista (sense el país local) ---------- */
    var list = COUNTRIES.filter(function (c) {
        return !localCountry || c[1] !== localCountry[1] || c[0] !== localCountry[0];
    });
    list.sort(function (a, b) { return a[0].localeCompare(b[0], 'ca'); });

    for (var si = 0; si < list.length; si++) {
        slots.push(new Slot(si, list[si]));
    }

    function refreshVisible(animate) {
        visibleSlots.forEach(function (idx) {
            var s = slots[idx];
            if (s) s.tick(animate);
        });
    }

    /* =========================================================
       9. SCROLL SECTION (IntersectionObserver)
       ========================================================= */
    var scrollSection = document.getElementById('scroll-section');
    var sectionVisible = false;

    var sectionObserver = new IntersectionObserver(function (entries) {
        var isVis = entries[0].isIntersecting;
        if (isVis === sectionVisible) return;
        sectionVisible = isVis;
        if (isVis) {
            scrollSection.classList.add('visible');
            refreshVisible(false);
        } else {
            scrollSection.classList.remove('visible');
        }
    }, { rootMargin: '0px 0px -10% 0px' });
    sectionObserver.observe(scrollSection);

    /* =========================================================
       10. BUCLE D'ACTUALITZACIÓ
       ========================================================= */
    var tickTimer = null;

    function scheduleTick() {
        if (tickTimer) return;
        var delay = 1000 - (Date.now() % 1000);
        tickTimer = setTimeout(function () {
            tickTimer = null;
            updateMain(true);
            refreshVisible(true);
            scheduleTick();
        }, delay);
    }
    scheduleTick();

    document.addEventListener('visibilitychange', function () {
        orbRunning = !document.hidden && !reduceMotion;
        if (orbRunning) requestAnimationFrame(animateOrb);

        if (document.hidden) {
            if (tickTimer) { clearTimeout(tickTimer); tickTimer = null; }
        } else {
            updateMain(true);
            refreshVisible(true);
            scheduleTick();
        }
    });

})();
</script>
</body>
</html>
