<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; }

:root {
    --bg: #f5f4f3;
    --fg: #000000;
    --btn-bg: rgba(0, 0, 0, 0.06);
    --btn-bg-hover: rgba(0, 0, 0, 0.14);
    --panel-bg: #ffffff;
    --panel-active: #ffffff;
    --panel-soft: rgba(0, 0, 0, 0.04);
    --panel-border: rgba(0, 0, 0, 0.08);
    --accent: #f5b400;
    --orb-c1: rgba(255, 20, 147, 0.55);
    --orb-c2: rgba(255, 80, 0, 0.35);
    --orb-c3: rgba(255, 180, 0, 0.12);
}
body.alt {
    --bg: #121212;
    --fg: #f5f4f3;
    --btn-bg: rgba(255, 255, 255, 0.10);
    --btn-bg-hover: rgba(255, 255, 255, 0.20);
    --panel-bg: #1a1a1a;
    --panel-active: #2c2c2c;
    --panel-soft: rgba(255, 255, 255, 0.05);
    --panel-border: rgba(255, 255, 255, 0.10);
}

html, body { margin: 0; padding: 0; width: 100%; }

html {
    scrollbar-width: none;
    -ms-overflow-style: none;
}
html::-webkit-scrollbar,
body::-webkit-scrollbar {
    width: 0;
    height: 0;
    display: none;
}

body {
    background-color: var(--bg);
    color: var(--fg);
    transition: background-color .5s ease, color .5s ease;
    position: relative;
    overflow-x: hidden;
    font-family: system-ui, -apple-system, sans-serif;
}
body.no-scroll { overflow: hidden; }

/* ==== ORBE ==== */
.floating-orb {
    position: fixed;
    top: 0;
    left: 0;
    width: 320px;
    height: 320px;
    border-radius: 50%;
    background: radial-gradient(circle,
                var(--orb-c1) 0%,
                var(--orb-c2) 45%,
                var(--orb-c3) 72%,
                transparent 90%);
    filter: blur(30px);
    pointer-events: none;
    z-index: 0;
    transform: translate3d(0, 0, 0);
    will-change: transform;
    contain: strict;
    transition: background .8s ease;
}

/* ==== TOP CONTROLS ==== */
#top-controls {
    position: fixed;
    top: 1.25rem;
    right: 1.25rem;
    z-index: 90;
    display: flex;
    gap: 0.5rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity .5s ease;
}
#top-controls.visible { opacity: 1; pointer-events: auto; }

#top-controls button {
    padding: 0.5rem;
    border-radius: 9999px;
    border: none;
    background-color: var(--btn-bg);
    color: var(--fg);
    cursor: pointer;
    transition: background-color .2s ease, transform .25s cubic-bezier(.22,1,.36,1);
    display: flex;
    align-items: center;
    justify-content: center;
}
#top-controls button:hover {
    background-color: var(--btn-bg-hover);
    transform: translateY(-1px) scale(1.05);
}
#top-controls button:active { transform: scale(.95); }
#top-controls button svg { display: block; }

#settings-icon svg { transition: transform .5s cubic-bezier(.22,1,.36,1); }
#settings-icon:hover svg { transform: rotate(90deg); }

/* ==== MAIN ==== */
.main-wrap {
    position: relative;
    z-index: 10;
    width: 100%;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    padding: 4rem 0;
}

.main-container {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', 'Arial Narrow', sans-serif;
    font-size: 20vw;
    letter-spacing: -0.05em;
    line-height: 1;
    padding: 0 1rem;
    flex-shrink: 0;
}
@media (min-width: 768px) {
    .main-container { font-size: 16vw; }
}

.group {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex-shrink: 0;
}

/* ==== WHEELS ==== */
.wheel-mask {
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 12%, #000 88%, transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0%, #000 12%, #000 88%, transparent 100%);
    flex-shrink: 0;
}

.number-wheel {
    display: inline-flex;
    justify-content: center;
    align-items: flex-start;
    overflow: hidden;
    height: 1em;
    line-height: 1em;
    position: relative;
    flex-shrink: 0;
    contain: strict;
}

.number-track {
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    backface-visibility: hidden;
    will-change: transform;
}

.number-track > span {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 1em;
    line-height: 1em;
    flex: 0 0 1em;
    white-space: nowrap;
}

.colon {
    font-size: 0.22em;
    opacity: 0.5;
    line-height: 1;
    align-self: center;
    user-select: none;
    margin: 0 0.2em;
}

/* ==== SCROLL SECTION ==== */
#scroll-section {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 72rem;
    margin: 0 auto;
    padding: 4rem 1rem 6rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity .8s ease;
}
#scroll-section.visible { opacity: 1; pointer-events: auto; }

#section-title {
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    text-align: center;
    opacity: 0.45;
    margin: 0 0 1.6rem;
}

/* ==== SEARCH ==== */
#search-wrap {
    position: relative;
    max-width: 440px;
    margin: 0 auto 3.5rem;
    isolation: isolate;
}
#search-wrap::before {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 999px;
    background: linear-gradient(120deg,
                var(--orb-c1), var(--orb-c2), var(--orb-c3),
                var(--orb-c2), var(--orb-c1));
    background-size: 320% 320%;
    opacity: 0;
    filter: blur(16px);
    transition: opacity .5s ease;
    z-index: -1;
    animation: searchGlow 7s ease infinite;
    pointer-events: none;
}
@keyframes searchGlow {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
}
#search-wrap:hover::before,
#search-wrap:focus-within::before { opacity: .85; }

.search-icon {
    position: absolute;
    left: 1.15rem;
    top: 50%;
    transform: translateY(-50%);
    width: 17px;
    height: 17px;
    opacity: .45;
    transition: transform .45s cubic-bezier(.22,1,.36,1), opacity .3s ease;
    pointer-events: none;
    color: var(--fg);
}
#search-wrap:hover .search-icon {
    transform: translateY(-50%) rotate(-14deg) scale(1.12);
    opacity: .85;
}
#search-wrap:focus-within .search-icon {
    transform: translateY(-50%) rotate(0deg) scale(1);
    opacity: 1;
}

#search-input {
    width: 100%;
    padding: 0.95rem 3rem 0.95rem 3rem;
    border-radius: 999px;
    border: 1px solid var(--panel-border);
    background: var(--btn-bg);
    color: var(--fg);
    font-size: 0.95rem;
    font-family: inherit;
    outline: none;
    transition: transform .45s cubic-bezier(.22,1,.36,1),
                background-color .3s ease,
                border-color .3s ease,
                box-shadow .45s ease;
}
#search-input::placeholder { color: currentColor; opacity: .4; }
#search-wrap:hover #search-input {
    transform: translateY(-3px);
    background: var(--btn-bg-hover);
    box-shadow: 0 10px 30px rgba(0, 0, 0, .07);
}
#search-input:focus {
    transform: translateY(-3px);
    border-color: transparent;
    background: var(--btn-bg-hover);
    box-shadow: 0 12px 36px rgba(0, 0, 0, .10);
}

#search-clear {
    position: absolute;
    right: 0.7rem;
    top: 50%;
    transform: translateY(-50%) scale(.7);
    width: 1.8rem;
    height: 1.8rem;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--fg);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease, transform .3s cubic-bezier(.22,1,.36,1), background-color .2s ease;
    font-size: 1.1rem;
    line-height: 1;
}
#search-clear.show {
    opacity: .5;
    pointer-events: auto;
    transform: translateY(-50%) scale(1);
}
#search-clear:hover {
    opacity: 1 !important;
    background: var(--btn-bg);
    transform: translateY(-50%) scale(1.1) rotate(90deg);
}

#search-empty {
    text-align: center;
    font-size: 0.78rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0;
    margin: -2rem 0 2rem;
    transition: opacity .3s ease;
    font-weight: 600;
}
#search-empty.show { opacity: .4; }

/* ==== GRID ==== */
#small-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 3.5rem 2rem;
}
@media (min-width: 768px) {
    #small-grid { grid-template-columns: repeat(3, 1fr); }
}

.slot {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    content-visibility: auto;
    contain-intrinsic-size: 0 5rem;
    contain: layout style;
    transition: opacity .35s ease, transform .35s cubic-bezier(.22,1,.36,1);
}
.slot.hidden {
    display: none;
}
.slot.filtered-out {
    opacity: 0;
    transform: scale(.9);
}

.small-title {
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.7;
    margin-bottom: 0.7rem;
    font-family: system-ui, -apple-system, sans-serif;
    font-weight: 700;
    text-align: center;
    min-height: 1.2em;
    padding: 0 1.6rem;
}

.slot-star {
    position: absolute;
    top: -0.35rem;
    right: 0.15rem;
    width: 1.7rem;
    height: 1.7rem;
    padding: 0;
    border: none;
    background: transparent;
    color: var(--fg);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    opacity: 0;
    transform: scale(.8);
    transition: opacity .25s ease, transform .3s cubic-bezier(.22,1,.36,1), color .25s ease, background-color .2s ease;
}
.slot:hover .slot-star { opacity: .35; transform: scale(1); }
.slot-star:hover {
    opacity: 1 !important;
    transform: scale(1.18) !important;
    background: var(--btn-bg);
}
.slot-star svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.slot-star.active,
.slot:hover .slot-star.active {
    opacity: 1;
    transform: scale(1);
    color: var(--accent);
}
.slot-star.active svg { fill: currentColor; }

@media (hover: none) {
    .slot-star { opacity: .35; transform: scale(1); }
}

.small-countdown-wrap {
    font-size: clamp(1.5rem, 2.6vw, 2.4rem);
    font-family: 'Bebas Neue', 'Arial Narrow', sans-serif;
    letter-spacing: -0.05em;
    display: flex;
    align-items: center;
    justify-content: center;
}

.small-group {
    display: flex;
    align-items: center;
    flex-shrink: 0;
}

.small-colon {
    font-size: 0.5em;
    opacity: 0.55;
    line-height: 1;
    align-self: center;
    margin: 0 0.2em;
    transform: translateY(-0.05em);
}

/* =========================================================
   SETTINGS POPUP
   ========================================================= */
#settings-overlay {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    background: rgba(0, 0, 0, .35);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .35s ease;
}
#settings-overlay.open {
    opacity: 1;
    pointer-events: auto;
}

#settings-panel {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 470px;
    max-height: 86vh;
    background: var(--panel-bg);
    color: var(--fg);
    border: 1px solid var(--panel-border);
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0, 0, 0, .28), 0 0 0 1px rgba(0,0,0,.02);
    transform: scale(.94) translateY(14px);
    transition: transform .45s cubic-bezier(.22, 1, .36, 1);
}
#settings-overlay.open #settings-panel {
    transform: scale(1) translateY(0);
}

.settings-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.15rem 1.4rem;
    border-bottom: 1px solid var(--panel-border);
    flex-shrink: 0;
}
.settings-header h2 {
    margin: 0;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    opacity: .75;
}
#settings-close {
    width: 2rem;
    height: 2rem;
    border-radius: 50%;
    border: none;
    background: var(--panel-soft);
    color: var(--fg);
    font-size: 1.15rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color .2s ease, transform .3s cubic-bezier(.22,1,.36,1);
    padding: 0;
}
#settings-close:hover {
    background: var(--btn-bg-hover);
    transform: rotate(90deg);
}

.settings-body {
    overflow-y: auto;
    padding: 1.35rem 1.4rem 1.5rem;
    -webkit-overflow-scrolling: touch;
}
.settings-body::-webkit-scrollbar { width: 6px; }
.settings-body::-webkit-scrollbar-thumb {
    background: var(--panel-border);
    border-radius: 999px;
}

.setting-group { margin-bottom: 1.6rem; }
.setting-group:last-child { margin-bottom: 0; }

.setting-label {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.5rem;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: .55;
    margin-bottom: 0.75rem;
}
.setting-label .hint {
    font-size: 0.62rem;
    letter-spacing: 0.12em;
    opacity: .8;
    font-weight: 600;
}
.setting-label .hint.limit { color: var(--accent); opacity: 1; }

/* Swatches */
.color-swatches {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
}
.swatch {
    position: relative;
    width: 2.1rem;
    height: 2.1rem;
    border-radius: 50%;
    border: none;
    padding: 0;
    cursor: pointer;
    transition: transform .3s cubic-bezier(.22,1,.36,1), box-shadow .3s ease;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
}
.swatch:hover { transform: scale(1.14) translateY(-2px); }
.swatch::after {
    content: '';
    position: absolute;
    inset: -5px;
    border-radius: 50%;
    border: 1.5px solid var(--fg);
    opacity: 0;
    transform: scale(.85);
    transition: opacity .3s ease, transform .3s cubic-bezier(.22,1,.36,1);
}
.swatch.active::after {
    opacity: .55;
    transform: scale(1);
}
.swatch.active { transform: scale(1.08); }

/* Segmented */
.segmented {
    display: flex;
    gap: 0.25rem;
    padding: 0.28rem;
    background: var(--panel-soft);
    border-radius: 14px;
}
.segmented button {
    flex: 1;
    padding: 0.55rem 0.4rem;
    border: none;
    background: transparent;
    color: var(--fg);
    font-family: inherit;
    font-size: 0.76rem;
    font-weight: 600;
    letter-spacing: .02em;
    border-radius: 11px;
    cursor: pointer;
    opacity: .55;
    transition: background-color .3s ease, opacity .25s ease, transform .25s cubic-bezier(.22,1,.36,1);
}
.segmented button:hover { opacity: .9; }
.segmented button.active {
    opacity: 1;
    background: var(--panel-active);
    box-shadow: 0 1px 4px rgba(0,0,0,.10), 0 0 0 1px var(--panel-border);
}
.segmented button:active { transform: scale(.96); }

/* Favorites */
.fav-tools {
    position: relative;
    margin-bottom: 0.6rem;
}
#fav-search {
    width: 100%;
    padding: 0.65rem 0.9rem;
    border-radius: 12px;
    border: 1px solid var(--panel-border);
    background: var(--panel-soft);
    color: var(--fg);
    font-size: 0.82rem;
    font-family: inherit;
    outline: none;
    transition: border-color .25s ease, background-color .25s ease;
}
#fav-search::placeholder { color: currentColor; opacity: .4; }
#fav-search:focus {
    border-color: var(--fg);
    background: transparent;
}

#fav-list {
    max-height: 190px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    border-radius: 12px;
    background: var(--panel-soft);
    padding: 0.3rem;
}
#fav-list::-webkit-scrollbar { width: 5px; }
#fav-list::-webkit-scrollbar-thumb {
    background: var(--panel-border);
    border-radius: 999px;
}

.fav-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem;
    width: 100%;
    padding: 0.5rem 0.65rem;
    border: none;
    background: transparent;
    color: var(--fg);
    font-family: inherit;
    font-size: 0.8rem;
    text-align: left;
    border-radius: 9px;
    cursor: pointer;
    transition: background-color .2s ease, transform .2s cubic-bezier(.22,1,.36,1);
}
.fav-item:hover {
    background: var(--btn-bg);
    transform: translateX(3px);
}
.fav-item span {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: .85;
}
.fav-item svg {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linejoin: round;
    stroke-linecap: round;
    opacity: .3;
    transition: opacity .2s ease, fill .2s ease, color .2s ease, transform .25s cubic-bezier(.22,1,.36,1);
}
.fav-item:hover svg { opacity: .6; transform: scale(1.1); }
.fav-item.active svg { opacity: 1; fill: currentColor; color: var(--accent); }
.fav-item.disabled { opacity: .35; cursor: not-allowed; }
.fav-item.disabled:hover { transform: none; background: transparent; }

/* Actions */
.setting-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
}
.setting-actions button {
    padding: 0.7rem 0.6rem;
    border-radius: 12px;
    border: 1px solid var(--panel-border);
    background: var(--panel-soft);
    color: var(--fg);
    font-family: inherit;
    font-size: 0.76rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color .22s ease, transform .22s cubic-bezier(.22,1,.36,1), border-color .22s ease;
}
.setting-actions button:hover {
    background: var(--btn-bg-hover);
    transform: translateY(-1px);
}
.setting-actions button:active { transform: translateY(0) scale(.98); }
.setting-actions button.danger:hover {
    color: #ff4d4d;
    border-color: rgba(255, 77, 77, .35);
}
.setting-actions .full { grid-column: 1 / -1; }

/* Toast */
#toast {
    position: fixed;
    left: 50%;
    bottom: 2rem;
    transform: translateX(-50%) translateY(20px);
    background: var(--panel-bg);
    color: var(--fg);
    border: 1px solid var(--panel-border);
    padding: 0.65rem 1.2rem;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: .02em;
    box-shadow: 0 12px 40px rgba(0,0,0,.2);
    opacity: 0;
    pointer-events: none;
    z-index: 300;
    transition: opacity .35s ease, transform .45s cubic-bezier(.22,1,.36,1);
}
#toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

/* ===== Detail level effects ===== */
body[data-detail="min"] .slot-star,
body[data-detail="min"] #search-wrap::before { animation: none !important; }
body[data-detail="min"] #top-controls button:hover { transform: none; }
</style>
</head>
<body>

    <div id="glowing-orb" class="floating-orb"></div>

    <div id="top-controls">
        <button id="settings-icon" aria-label="Configuració">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor"

    var DEFAULT_SETTINGS = {
        theme: 'light',
        orbColor: 'sunset',
        orbSpeed: 'normal',
        detail: 'max',
        favorites: []

    var settings = {
        theme: DEFAULT_SETTINGS.theme,

    function sanitizeSettings(s) {
        var out = {
            theme: (s.theme === 'dark' || s.theme === 'light') ? s.theme : DEFAULT_SETTINGS.theme,
            orbColor: ORB_COLORS[s.orbColor] ? s.orbColor : DEFAULT_SETTINGS.orbColor,
            orbSpeed: ORB_SPEEDS[s.orbSpeed] ? s.orbSpeed : DEFAULT_SETTINGS.orbSpeed,
            detail: (s.detail === 'max' || s.detail === 'medium' || s.detail === 'min') ? s.detail : DEFAULT_SETTINGS.detail,
            favorites: Array.isArray(s.favorites)
                ? s.favorites.filter(function (n) { return typeof n === 'string'; }).slice(0, MAX_FAVORITES)
                : []
        };
        return out;
    }

    function loadSettings() {
        try {
            var raw = localStorage.getItem(STORAGE_KEY);
            if (raw) settings = sanitizeSettings(JSON.parse(raw));
        } catch (e) { /* ignore */ }
    }

    function saveSettings() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(settings)); } catch (e) {}
    }

    loadSettings();

       2. ORBE ANIMADA
       ========================================================= */
    var orb = document.getElementById('glowing-orb');
    var orbRunning = !reduceMotion;
    var lastOrbFrame = 0;
    var orbStaticSet = false;

    function applyOrbColor() {
        var def = ORB_COLORS[settings.orbColor] || ORB_COLORS.sunset;
        var root = document.documentElement.style;
        root.setProperty('--orb-c1', def.c[0]);
        root.setProperty('--orb-c2', def.c[1]);
        root.setProperty('--orb-c3', def.c[2]);
    }

    function animateOrb(now) {
        if (!orbRunning) return;
        if (now - lastOrbFrame > 33) {
            var detail = settings.detail;
            var amp = detail === 'min' ? 0 : (detail === 'medium' ? 0.22 : 1);
            var spd = ORB_SPEEDS[settings.orbSpeed] || 1;

        wheelHtmlCache[key] = html;
        return html;
    }

    function measureDigit(digit, fontSize) {
        var key = digit + '@' + fontSize.toFixed(2);

        digitWidthCache[key] = w;
        return w;

        this.L        = maxDigit + 1;
        this.repeats  = repeats || 3;
        this.total    = this.L * this.repeats;
        this.pos      = 0;
        this.digit    = null;
        this.step     = 0;
        this.wheelEl  = trackEl.parentElement;

        trackEl.innerHTML = getWheelHtml(maxDigit, this.repeats);
        allWheels.push(this);
    }

    Wheel.prototype._measure = function () {
        var fs = parseFloat(window.getComputedStyle(this.track).fontSize);
        this.step = (isFinite(fs) && fs > 0) ? fs : 16;
    };

    Wheel.prototype._fitWidth = function () {
        if (this.digit === null) return;
        var w = measureDigit(this.digit, this.step);
        this.wheelEl.style.width = w + 'px';
    };

        if (!this.step) this._measure();
        this.track.style.transform =

    Wheel.prototype.remeasure = function () {
        this._measure();
        this._render(false);
        this._fitWidth();
    };

    Wheel.prototype.reset = function (digit) {

        else if (digit < 0) digit = 0;

        this.pos = this.L + digit;
        this._render(false);
        this._fitWidth();
        void this.track.offsetHeight;
    };

    Wheel.prototype.set = function (digit, animate) {
        if (digit > this.maxDigit) digit = this.maxDigit;
        else if (digit < 0) digit = 0;
        if (digit === this.digit) return;
        if (!animate || this.digit === null) { this.reset(digit); return; }
        var L = this.L;
        var steps = ((digit - this.digit) % L + L) % L;
        if (steps === 0) return;
        if (steps * 2 > L) { this.reset(digit); return; }
        if (this.pos + steps > this.total - 1) {
            this.pos -= L;
            this._render(false);
            void this.track.offsetHeight;
        }
        this.pos += steps;
        this.digit = digit;
        this._render(true);
        this._fitWidth();
    };

        ['Tanzània', 'Africa/Dar_es_Salaam'], ['Timor Oriental', 'Asia/Dili'], ['Togo', 'Africa/Lome'],
        ['Tonga', 'Pacific/Tongatapu'], ['Trinitat i Tobago', 'America/Port_of_Spain'],
        ['Tunísia', 'Africa/Tunis'], ['Turkmenistan', 'Asia/Ashgabat'], ['Turquia', 'Europe/Istanbul'],
        ['Tuvalu', 'Pacific/Funafuti'], ['Ucraïna', 'Europe/Kyiv'], ['Uganda', 'Africa/Kampala'],
        ['Uruguai', 'America/Montevideo'], ['Uzbekistan', 'Asia/Tashkent'], ['Vanuatu', 'Pacific/Efate'],
        ['Vaticà', 'Europe/Vatican'], ['Veneçuela', 'America/Caracas'],
        ['Vietnam', 'Asia/Ho_Chi_Minh'], ['Xile', 'America/Santiago'], ['Xina', 'Asia/Shanghai'],
        ['Xipre', 'Asia/Nicosia'], ['Zàmbia', 'Africa/Lusaka'], ['Zimbabwe', 'Africa/Harare'],
        ['Illes Marshall', 'Pacific/Majuro'], ['Illes Salomó', 'Pacific/Guadalcanal']
    ];

    /* =========================================================
       6. CACHE D'OFFSETS
       ========================================================= */
    var tzFmtCache = {};
    var tzOffsetCache = {};
    var TZ_OFFSET_TTL = 30 * 60 * 1000;

    function tzFormatter(tz) {
        var f = tzFmtCache[tz];
        if (f === undefined) {
            try {
                f = new Intl.DateTimeFormat('en-GB', {
                    timeZone: tz, hour12: false,
                    hour: '2-digit', minute: '2-digit', second: '2-digit'
                });
            } catch (e) { f = null; }
            tzFmtCache[tz] = f;
        }
        return f;
    }

    function getTzOffsetMs(tz) {
        var cached = tzOffsetCache[tz];
        var now = Date.now();
        if (cached !== undefined && now - cached.at < TZ_OFFSET_TTL) return cached.off;
        var f = tzFormatter(tz);
        var off = 0;
        if (f) {
            var d = new Date(now);
            var parts = f.formatToParts(d);
            var h = 0, m = 0, s = 0;
            for (var i = 0; i < parts.length; i++) {
                var p = parts[i], t = p.type;
                if (t === 'hour') h = parseInt(p.value, 10) % 24;
                else if (t === 'minute') m = parseInt(p.value, 10);
                else if (t === 'second') s = parseInt(p.value, 10);
            }
            var localSec = h * 3600 + m * 60 + s;
            var utcSec = d.getUTCHours() * 3600 + d.getUTCMinutes() * 60 + d.getUTCSeconds();
            var diff = localSec - utcSec;
            if (diff > 43200) diff -= 86400;
            else if (diff < -43200) diff += 86400;
            off = diff * 1000;
        }
        tzOffsetCache[tz] = { off: off, at: now };
        return off;
    }

    function secondsInDay(tz) {
        var ms = Date.now() + getTzOffsetMs(tz);
        var totalSec = Math.floor(ms / 1000);
        var s = totalSec % 86400;
        return s < 0 ? s + 86400 : s;
    }

    /* =========================================================
       7. DETECCIÓ DEL PAÍS LOCAL
       ========================================================= */
    var localTz = '';
    try { localTz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}

    var localCountry = null;
    for (var ci = 0; ci < COUNTRIES.length; ci++) {
        if (COUNTRIES[ci][1] === localTz) { localCountry = COUNTRIES[ci]; break; }
    }

    /* =========================================================
       8. RELLOTGE PRINCIPAL
       ========================================================= */
    var mainHT = new Wheel(document.getElementById('hours-tens-track'),  2, 3);
    var mainHU = new Wheel(document.getElementById('hours-units-track'), 9, 3);
    var mainMT = new Wheel(document.getElementById('mins-tens-track'),   5, 3);
    var mainMU = new Wheel(document.getElementById('mins-units-track'),  9, 3);
    var mainST = new Wheel(document.getElementById('secs-tens-track'),   5, 3);
    var mainSU = new Wheel(document.getElementById('secs-units-track'),  9, 3);

    function updateMain(animate) {
        var d = new Date();
        var h = d.getHours(), m = d.getMinutes(), s = d.getSeconds();
        mainHT.set((h / 10) | 0, animate);
        mainHU.set(h % 10, animate);
        mainMT.set((m / 10) | 0, animate);
        mainMU.set(m % 10, animate);
        mainST.set((s / 10) | 0, animate);
        mainSU.set(s % 10, animate);
    }
    updateMain(false);

    /* =========================================================
       9. GRAELLA DE PAÏSOS
       ========================================================= */
    var grid = document.getElementById('small-grid');
    var slots = [];
    var visibleSlots = new Set();

    var slotObserver = new IntersectionObserver(function (entries) {
        for (var i = 0; i < entries.length; i++) {
            var entry = entries[i];
            var idx = entry.target.__slotIdx;
            if (entry.isIntersecting) {
                visibleSlots.add(idx);
                var s = slots[idx];
                if (s && !s.wheels) s.ensure();
                if (s) s.tick(false);
            } else {
                visibleSlots.delete(idx);
            }
        }
    }, { rootMargin: '400px 0px' });

    function groupHTML(prefix, wheels) {
        var html = '<div class="small-group"><div class="wheel-mask">';
        for (var i = 0; i < wheels.length; i++) {
            html += '<div class="number-wheel"><div class="number-track" id="' +
                    prefix + '-' + wheels[i] + '"></div></div>';
        }
        html += '</div></div>';
        return html;
    }

    var STAR_SVG =
        '<svg viewBox="0 0 24 24" aria-hidden="true">' +
        '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>' +
        '</svg>';

    function Slot(idx, country) {
        this.idx     = idx;
        this.name    = country[0];
        this.tz      = country[1];
        this.wheels  = null;

        var wrapper = document.createElement('div');
        wrapper.className = 'slot';
        wrapper.__slotIdx = idx;

        var p = 'slot-' + idx;
        wrapper.innerHTML =
            '<button type="button" class="slot-star" aria-label="Preferit">' + STAR_SVG + '</button>' +
            '<h3 class="small-title">' + country[0] + '</h3>' +
            '<div class="small-countdown-wrap">' +
                groupHTML(p, ['ht', 'hu']) +
                '<span class="small-colon">:</span>' +
                groupHTML(p, ['mt', 'mu']) +
                '<span class="small-colon">:</span>' +
                groupHTML(p, ['st', 'su']) +
            '</div>';

        var starBtn = wrapper.querySelector('.slot-star');
        starBtn.addEventListener('click', function (ev) {
            ev.stopPropagation();
            toggleFavorite(country[0]);
        });
        this.starBtn = starBtn;

        grid.appendChild(wrapper);
        this.el = wrapper;
        slotObserver.observe(wrapper);
    }

    Slot.prototype.ensure = function () {
        if (this.wheels) return;
        var p = 'slot-' + this.idx;
        this.wheels = {
            ht: new Wheel(document.getElementById(p + '-ht'), 2, 3),
            hu: new Wheel(document.getElementById(p + '-hu'), 9, 3),
            mt: new Wheel(document.getElementById(p + '-mt'), 5, 3),
            mu: new Wheel(document.getElementById(p + '-mu'), 9, 3),
            st: new Wheel(document.getElementById(p + '-st'), 5, 3),
            su: new Wheel(document.getElementById(p + '-su'), 9, 3)
        };
    };

    Slot.prototype._write = function (animate) {
        var sec = secondsInDay(this.tz);
        var h = (sec / 3600) | 0;
        var m = ((sec % 3600) / 60) | 0;
        var s = sec % 60;
        var w = this.wheels;
        w.ht.set((h / 10) | 0, animate);
        w.hu.set(h % 10, animate);
        w.mt.set((m / 10) | 0, animate);
        w.mu.set(m % 10, animate);
        w.st.set((s / 10) | 0, animate);
        w.su.set(s % 10, animate);
    };

    Slot.prototype.tick = function (animate) {
        this.ensure();
        this._write(animate);
    };

    var list = COUNTRIES.filter(function (c) {
        return !localCountry || c[1] !== localCountry[1] || c[0] !== localCountry[0];
    });
    list.sort(function (a, b) { return a[0].localeCompare(b[0], 'ca'); });

    for (var si = 0; si < list.length; si++) {
        slots.push(new Slot(si, list[si]));
    }

    function refreshVisible(animate) {
        visibleSlots.forEach(function (idx) {
            var s = slots[idx];
            if (s) s.tick(animate);
        });
    }

    /* =========================================================
       10. CERCADOR + PREFERITS
       ========================================================= */
    var searchWrap  = document.getElementById('search-wrap');
    var searchInput = document.getElementById('search-input');
    var searchClear = document.getElementById('search-clear');
    var searchEmpty = document.getElementById('search-empty');
    var favCountEl  = document.getElementById('fav-count');
    var favListEl   = document.getElementById('fav-list');
    var favSearch   = document.getElementById('fav-search');

    function slotByName(name) {
        for (var i = 0; i < slots.length; i++) {
            if (slots[i].name === name) return slots[i];
        }
        return null;
    }

    function isFavorite(name) {
        return settings.favorites.indexOf(name) !== -1;
    }

    function toggleFavorite(name) {
        var i = settings.favorites.indexOf(name);
        if (i !== -1) {
            settings.favorites.splice(i, 1);
        } else {
            if (settings.favorites.length >= MAX_FAVORITES) {
                showToast('Màxim ' + MAX_FAVORITES + ' preferits');
                return;
            }
            settings.favorites.push(name);
        }
        saveSettings();
        updateFavoritesUI();
        applyOrder();
    }

    function updateFavoritesUI() {
        // Estrelles de les targetes
        for (var i = 0; i < slots.length; i++) {
            var s = slots[i];
            if (isFavorite(s.name)) s.starBtn.classList.add('active');
            else s.starBtn.classList.remove('active');
        }
        // Contador
        favCountEl.textContent = settings.favorites.length + ' / ' + MAX_FAVORITES;
        favCountEl.classList.toggle('limit', settings.favorites.length >= MAX_FAVORITES);
        // Llista del popup
        var items = favListEl.querySelectorAll('.fav-item');
        var full = settings.favorites.length >= MAX_FAVORITES;
        for (var j = 0; j < items.length; j++) {
            var it = items[j];
            var nm = it.getAttribute('data-name');
            var active = isFavorite(nm);
            it.classList.toggle('active', active);
            it.classList.toggle('disabled', !active && full);
            it.setAttribute('aria-pressed', active ? 'true' : 'false');
        }
    }

    /* ---------- Ordenar la graella: preferits primer ---------- */
    function applyOrder() {
        var favIdx = {};
        for (var i = 0; i < settings.favorites.length; i++) favIdx[settings.favorites[i]] = i;

        var sorted = slots.slice().sort(function (a, b) {
            var ai = favIdx[a.name], bi = favIdx[b.name];
            var af = ai !== undefined, bf = bi !== undefined;
            if (af && bf) return ai - bi;
            if (af) return -1;
            if (bf) return 1;
            return a.name.localeCompare(b.name, 'ca');
        });

        var frag = document.createDocumentFragment();
        for (var k = 0; k < sorted.length; k++) frag.appendChild(sorted[k].el);
        grid.appendChild(frag);
    }

    /* ---------- Cerca ---------- */
    function applySearch() {
        var q = searchInput.value.trim().toLowerCase();
        var visible = 0;
        for (var i = 0; i < slots.length; i++) {
            var s = slots[i];
            var match = !q || s.name.toLowerCase().indexOf(q) !== -1;
            s.el.classList.toggle('hidden', !match);
            if (match) visible++;
        }
        searchClear.classList.toggle('show', q.length > 0);
        searchEmpty.classList.toggle('show', visible === 0 && q.length > 0);
    }

    searchInput.addEventListener('input', applySearch);
    searchClear.addEventListener('click', function () {
        searchInput.value = '';
        applySearch();
        searchInput.focus();
    });
    searchWrap.addEventListener('submit', function (e) { e.preventDefault(); });

    /* ---------- Construcció de la llista de preferits ---------- */
    (function buildFavList() {
        var sorted = slots.slice().sort(function (a, b) {
            return a.name.localeCompare(b.name, 'ca');
        });
        var html = '';
        for (var i = 0; i < sorted.length; i++) {
            html += '<button type="button" class="fav-item" data-name="' +
                    sorted[i].name.replace(/"/g, '&quot;') + '" aria-pressed="false">' +
                    '<span>' + sorted[i].name + '</span>' + STAR_SVG + '</button>';
        }
        favListEl.innerHTML = html;

        favListEl.addEventListener('click', function (e) {
            var btn = e.target.closest('.fav-item');
            if (!btn) return;
            toggleFavorite(btn.getAttribute('data-name'));
        });
    })();

    favSearch.addEventListener('input', function () {
        var q = this.value.trim().toLowerCase();
        var items = favListEl.querySelectorAll('.fav-item');
        for (var i = 0; i < items.length; i++) {
            var nm = items[i].getAttribute('data-name').toLowerCase();
            items[i].style.display = (!q || nm.indexOf(q) !== -1) ? '' : 'none';
        }
    });

    /* =========================================================
       11. SECCIÓ SCROLL
       ========================================================= */
    var scrollSection = document.getElementById('scroll-section');
    var sectionVisible = false;

    var sectionObserver = new IntersectionObserver(function (entries) {
        var isVis = entries[0].isIntersecting;
        if (isVis === sectionVisible) return;
        sectionVisible = isVis;
        if (isVis) {
            scrollSection.classList.add('visible');
            refreshVisible(false);
        } else {
            scrollSection.classList.remove('visible');
        }
    }, { rootMargin: '0px 0px -10% 0px' });
    sectionObserver.observe(scrollSection);

    /* =========================================================
       12. PANELL DE CONFIGURACIÓ
       ========================================================= */
    var settingsIcon    = document.getElementById('settings-icon');
    var settingsOverlay = document.getElementById('settings-overlay');
    var settingsClose   = document.getElementById('settings-close');
    var colorSwatches   = document.getElementById('color-swatches');
    var speedSeg        = document.getElementById('speed-seg');
    var detailSeg       = document.getElementById('detail-seg');
    var exportBtn       = document.getElementById('export-btn');
    var importBtn       = document.getElementById('import-btn');
    var importFile      = document.getElementById('import-file');
    var resetBtn        = document.getElementById('reset-btn');
    var toastEl         = document.getElementById('toast');

    /* ---------- Toast ---------- */
    var toastTimer = null;
    function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
            toastEl.classList.remove('show');
        }, 1900);
    }

    /* ---------- Swatches ---------- */
    (function buildSwatches() {
        var html = '';
        for (var key in ORB_COLORS) {
            if (!ORB_COLORS.hasOwnProperty(key)) continue;
            html += '<button type="button" class="swatch" data-value="' + key +
                    '" style="background:' + ORB_COLORS[key].swatch +
                    '" aria-label="' + ORB_COLORS[key].label + '" title="' +
                    ORB_COLORS[key].label + '"></button>';
        }
        colorSwatches.innerHTML = html;

        colorSwatches.addEventListener('click', function (e) {
            var btn = e.target.closest('.swatch');
            if (!btn) return;
            settings.orbColor = btn.getAttribute('data-value');
            saveSettings();
            applyOrbColor();
            syncSettingsUI();
        });
    })();

    /* ---------- Segmented ---------- */
    function bindSegmented(el, key, onChange) {
        el.addEventListener('click', function (e) {
            var btn = e.target.closest('button[data-value]');
            if (!btn) return;
            var val = btn.getAttribute('data-value');
            if (settings[key] === val) return;
            settings[key] = val;
            saveSettings();
            syncSettingsUI();
            if (onChange) onChange(val);
        });
    }
    bindSegmented(speedSeg, 'orbSpeed');
    bindSegmented(detailSeg, 'detail');

    function setActiveSegment(container, value) {
        var btns = container.querySelectorAll('button[data-value]');
        for (var i = 0; i < btns.length; i++) {
            btns[i].classList.toggle('active', btns[i].getAttribute('data-value') === value);
        }
    }

    function syncSettingsUI() {
        // Swatches
        var sw = colorSwatches.querySelectorAll('.swatch');
        for (var i = 0; i < sw.length; i++) {
            sw[i].classList.toggle('active', sw[i].getAttribute('data-value') === settings.orbColor);
        }
        setActiveSegment(speedSeg, settings.orbSpeed);
        setActiveSegment(detailSeg, settings.detail);
        document.body.setAttribute('data-detail', settings.detail);
        updateFavoritesUI();
    }

    /* ---------- Obrir / tancar ---------- */
    function openSettings() {
        settingsOverlay.classList.add('open');
        document.body.classList.add('no-scroll');
        syncSettingsUI();
        setTimeout(function () { settingsClose.focus(); }, 60);
    }
    function closeSettings() {
        settingsOverlay.classList.remove('open');
        document.body.classList.remove('no-scroll');
    }

    settingsIcon.addEventListener('click', openSettings);
    settingsClose.addEventListener('click', closeSettings);
    settingsOverlay.addEventListener('click', function (e) {
        if (e.target === settingsOverlay) closeSettings();
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && settingsOverlay.classList.contains('open')) closeSettings();
    });

    /* ---------- Export / Import ---------- */
    function exportConfig() {
        var payload = {
            app: 'world-clock',
            version: 1,
            exportedAt: new Date().toISOString(),
            settings: settings
        };
        var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'world-clock.clock';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        showToast('Configuració exportada');
    }

    function importConfig(file) {
        var reader = new FileReader();
        reader.onload = function (e) {
            try {
                var parsed = JSON.parse(e.target.result);
                var data = (parsed && parsed.settings) ? parsed.settings : parsed;
                settings = sanitizeSettings(data);
                saveSettings();
                applyTheme();
                applyOrbColor();
                syncSettingsUI();
                applyOrder();
                applySearch();
                showToast('Configuració importada');
            } catch (err) {
                showToast('Fitxer no vàlid');
            }
        };
        reader.onerror = function () { showToast('Error de lectura'); };
        reader.readAsText(file);
    }

    exportBtn.addEventListener('click', exportConfig);
    importBtn.addEventListener('click', function () { importFile.click(); });
    importFile.addEventListener('change', function () {
        if (this.files && this.files[0]) {
            importConfig(this.files[0]);
            this.value = '';
        }
    });

    resetBtn.addEventListener('click', function () {
        settings.theme = DEFAULT_SETTINGS.theme;
        settings.orbColor = DEFAULT_SETTINGS.orbColor;
        settings.orbSpeed = DEFAULT_SETTINGS.orbSpeed;
        settings.detail = DEFAULT_SETTINGS.detail;
        settings.favorites = [];
        saveSettings();
        applyTheme();
        applyOrbColor();
        syncSettingsUI();
        applyOrder();
        applySearch();
        showToast('Preferències restablertes');
    });

    /* =========================================================
       13. INICIALITZACIÓ
       ========================================================= */
    applyTheme();
    applyOrbColor();
    document.body.setAttribute('data-detail', settings.detail);
    applyOrder();
    applySearch();
    syncSettingsUI();

    /* =========================================================
       14. BUCLE D'ACTUALITZACIÓ
       ========================================================= */
    var tickTimer = null;

    function scheduleTick() {
        if (tickTimer) return;
        var delay = 1000 - (Date.now() % 1000);
        tickTimer = setTimeout(function () {
            tickTimer = null;
            updateMain(true);
            refreshVisible(true);
            scheduleTick();
        }, delay);
    }
    scheduleTick();

    document.addEventListener('visibilitychange', function () {
        orbRunning = !document.hidden && !reduceMotion;
        if (orbRunning) requestAnimationFrame(animateOrb);

        if (document.hidden) {
            if (tickTimer) { clearTimeout(tickTimer); tickTimer = null; }
        } else {
            updateMain(true);
            refreshVisible(true);
            scheduleTick();
        }
    });

})();
</script>
</body>
